name: packer-build
on:
  pull_request:
    branches: [ main ]

jobs:
  build-ami:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 建立 out/artifact.zip，確保 packer 有要打包的檔案
      - name: Build artifact.zip
        run: |
          pip install -r requirements.txt
          mkdir -p out
          zip -r out/artifact.zip app alembic alembic.ini requirements.txt start.sh

      # 安裝 Packer CLI
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3

      # 使用 Access Key 登入 AWS（DEV 帳號）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 初始化並驗證 Packer 設定
      - name: Packer init/validate
        working-directory: packer
        run: |
          packer init .
          packer validate \
            -var "region=${{ secrets.AWS_REGION }}" \
            -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
            -var "app_artifact=${{ github.workspace }}/out/artifact.zip" \
            -var "db_pass=${{ secrets.APP_DB_PASS }}" \
            mysql-ami.pkr.hcl

      # 建立 AMI
      - name: Packer build
        working-directory: packer
        run: |
          packer build \
            -var "region=${{ secrets.AWS_REGION }}" \
            -var "demo_account_id=${{ secrets.DEMO_ACCOUNT_ID }}" \
            -var "app_artifact=${{ github.workspace }}/out/artifact.zip" \
            -var "db_name=${{ secrets.DB_NAME }}" \
            -var "db_user=${{ secrets.DB_USER }}" \
            -var "db_pass=${{ secrets.APP_DB_PASS }}" \
            mysql-ami.pkr.hcl
